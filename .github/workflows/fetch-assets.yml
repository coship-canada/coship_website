name: Fetch Wix assets (run once, before cancelling Wix)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build.mjs && node scripts/fetch-wix-assets.mjs
      - name: Commit downloaded assets
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add assets embeds
          git diff --cached --quiet || git commit -m "Add images and embeds downloaded from Wix"
          git push
