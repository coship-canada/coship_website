<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    background: transparent;
    color: #111;
    overflow: hidden;
  }
  .state-box { padding: 32px 0; text-align: center; font-size: 16px; color: #888; }
  .state-box.error { color: #CC0000; }
  .spinner {
    width: 28px; height: 28px;
    border: 3px solid #eee;
    border-top-color: #CC0000;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .card { background: transparent; border: none; overflow: visible; width: 100%; }
  .card-top { padding: 0 0 22px 0; display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid #e8e8e8; flex-wrap: wrap; gap: 8px; }
  .card-top .lbl { font-size: 15px; color: #555; margin-bottom: 6px; }
  .card-top .hawb { font-size: 26px; font-weight: 700; color: #111; }
  .card-top-right { text-align: right; }
  .badge { display: inline-block; padding: 7px 20px; border-radius: 20px; font-size: 15px; font-weight: 700; margin-bottom: 6px; }
  .badge-delivered { background: #e6f4ea; color: #1a6e2e; border: 1px solid #b7dfbe; }
  .badge-transit   { background: #fce8e8; color: #CC0000; border: 1px solid #f5c0c0; }
  .badge-arrived   { background: #e8f0fe; color: #1a45a8; border: 1px solid #b0c8f5; }
  .badge-departed  { background: #fff3e0; color: #c45400; border: 1px solid #ffd599; }
  .badge-received  { background: #f3e8fd; color: #6b21a8; border: 1px solid #d4b0f5; }
  .badge-default   { background: #f0f0f0; color: #444;    border: 1px solid #ddd; }
  .last-update { font-size: 14px; color: #666; margin-top: 4px; }
  .progress-wrap { padding: 32px 0 24px; border-bottom: 1px solid #e8e8e8; }
  .progress-grid { display: grid; grid-template-columns: repeat(5, 1fr); align-items: flex-start; position: relative; }
  .progress-grid::before { content: ''; position: absolute; top: 22px; left: calc(10%); right: calc(10%); height: 3px; background: #ddd; z-index: 0; }
  .progress-fill { position: absolute; top: 22px; left: calc(10%); height: 3px; background: #CC0000; z-index: 1; }
  .step-item { display: flex; flex-direction: column; align-items: center; position: relative; z-index: 2; }
  .step-circle { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .step-done    { background: #CC0000; }
  .step-active  { background: #CC0000; box-shadow: 0 0 0 6px rgba(204,0,0,0.15); }
  .step-pending { background: #fff; border: 2px solid #ddd; }
  .step-label { font-size: 13px; color: #888; text-align: center; line-height: 1.4; font-weight: 500; margin-top: 8px; width: 100%; padding: 0 2px; word-break: break-word; }
  .step-label.active { color: #CC0000; font-weight: 700; }
  .latest-wrap { padding: 20px 0; border-bottom: 1px solid #e8e8e8; }
  .latest-box { background: #fff5f5; border-left: 3px solid #CC0000; border-radius: 0 8px 8px 0; padding: 16px 20px; }
  .latest-title { display: flex; align-items: flex-start; gap: 10px; font-size: 17px; font-weight: 700; color: #111; margin-bottom: 5px; line-height: 1.4; }
  .latest-title-text { flex: 1; word-break: break-word; }
  .red-dot { width: 11px; height: 11px; border-radius: 50%; background: #CC0000; flex-shrink: 0; margin-top: 5px; box-shadow: 0 0 0 3px rgba(204,0,0,0.2); }
  .latest-loc  { font-size: 15px; color: #1a45a8; font-weight: 600; padding-left: 21px; margin-bottom: 5px; }
  .latest-meta { font-size: 14px; color: #888; padding-left: 21px; }
  .history-wrap { padding: 22px 0; }
  .history-lbl { font-size: 14px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #555; margin-bottom: 14px; }
  .history-scroll { max-height: 300px; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; padding: 0 18px; }
  .history-scroll::-webkit-scrollbar { width: 4px; }
  .history-scroll::-webkit-scrollbar-track { background: transparent; }
  .history-scroll::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }
  .history-item { display: flex; gap: 24px; padding: 13px 0; border-bottom: 1px solid #f5f5f5; align-items: flex-start; }
  .history-item:last-child { border-bottom: none; }
  .h-date { font-size: 14px; color: #888; white-space: nowrap; min-width: 110px; }
  .h-right { flex: 1; }
  .h-status { font-size: 16px; color: #111; font-weight: 500; }
  .h-loc { font-size: 14px; color: #CC0000; margin-top: 4px; }
  @media (max-width: 480px) {
    .step-label { font-size: 11px; }
    .step-circle { width: 36px; height: 36px; }
    .card-top .hawb { font-size: 20px; }
    .h-date { min-width: 90px; font-size: 13px; }
    .h-status { font-size: 14px; }
    .latest-title { font-size: 15px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
  function sendHeight() {
    const h = document.getElementById("root").scrollHeight;
    window.parent.postMessage({ action: "setHeight", height: h }, "*");
  }

  const STEPS_KR_TO_CA = [
    { label: "Order\nreceived" },
    { label: "Departed\nICN" },
    { label: "Arrived\nat YVR" },
    { label: "In\ntransit" },
    { label: "Delivered" }
  ];

  const STEPS_CA_TO_KR = [
    { label: "Order\nreceived" },
    { label: "Departed\nYVR" },
    { label: "Arrived\nat ICN" },
    { label: "In\ntransit" },
    { label: "Delivered" }
  ];

  function detectDirection(rows) {
    if (!rows || rows.length === 0) return "KR_TO_CA";

    const CA_ORIGIN = [
      "vancouver airport", "yvr", "richmond", "toronto", "calgary",
      "montreal", "winnipeg", "edmonton", "canada post",
      "canada shipping", "캐나다쉬핑", "캐나다 쉬핑", "밴쿠버"
    ];
    const KR_ORIGIN = [
      "incheon international airport", "incheon airport", "icn",
      "anyang", "yongin", "seongnam", "east seoul",
      "국제우편물류센터", "안양우편", "성남우편", "용인우체국",
      "공항세관", "중부권", "인천"
    ];

    // the first (oldest) event shows where the parcel started
    const first = ((rows[0].location || "") + " " + (rows[0].status || "")).toLowerCase();
    if (/캐나다|canada|vancouver|yvr|toronto/.test(first)) return "CA_TO_KR";
    if (/한국|인천|incheon|icn|안양|서울/.test(first)) return "KR_TO_CA";

    let caScore = 0;
    let krScore = 0;

    rows.forEach(function(row, idx) {
      const loc      = (row.location || "").toLowerCase();
      const status   = (row.status   || "").toLowerCase();
      const combined = loc + " " + status;
      const weight   = idx === 0 ? 5 : idx === 1 ? 3 : 1;

      CA_ORIGIN.forEach(function(kw) { if (combined.includes(kw)) caScore += weight; });
      KR_ORIGIN.forEach(function(kw) { if (combined.includes(kw)) krScore += weight; });

      // 한국어 상태(출고, 발송, 출발) 추가
      const isDep = status.includes("dispatched") || status.includes("departed") || status.includes("shipped") || status.includes("출고") || status.includes("발송") || status.includes("출발");
      if (isDep && CA_ORIGIN.some(kw => loc.includes(kw))) caScore += 10;
      if (isDep && KR_ORIGIN.some(kw => loc.includes(kw))) krScore += 10;
    });

    console.log("Direction — CA_TO_KR:", caScore, "KR_TO_CA:", krScore);
    return caScore >= krScore ? "CA_TO_KR" : "KR_TO_CA";
  }

  function statusToStep(s, direction) {
    s = (s || "").toLowerCase();
    // Korean statuses returned by the tracking API
    if (/배달\s*완료|배송\s*완료|인수\s*완료|수령/.test(s)) return 4;
    if (/배달\s*준비|배달\s*출발|배송\s*출발|배송\s*중|집배원|배달/.test(s)) return 3;
    if (/통관|세관|우편집중|물류센터|구분|교환/.test(s)) return 3;
    if (/도착|입항|하기|하역/.test(s)) return 2;
    if (/출고|출항|출발|선적|탑재|항공기/.test(s)) return 1;
    
    // 한국어 배송완료 인식
    if (s === "delivered" || s.includes("배달완료") || s.includes("배송완료") || s.includes("수령완료")) return 4;
    if (s.includes("delivered") && !s.includes("out for")) return 4;
    
    // 한국어 이동중 인식
    if (s.includes("out for delivery") || s.includes("배달준비")) return 3;
    if (s.includes("in transit") || s.includes("이동중") || s.includes("운송중")) return 3;
    if (s.includes("item processed") || s.includes("접수") || s.includes("하차") || s.includes("집화완료")) return 3;
    if (s.includes("item in transit")) return 3;
    if (s.includes("item departed") || s.includes("출발") || s.includes("발송") || s.includes("출고") || s.includes("픽업")) return 3;
    if (s.includes("item out")) return 3;

    // 한국어 출발/도착 인식
    if (direction === "KR_TO_CA") {
      if (s.includes("arrived at yvr") || s.includes("밴쿠버공항 도착")) return 2;
      if (s.includes("arrived") && !s.includes("icn") && !s.includes("인천")) return 2;
      if (s.includes("customs") || s.includes("import") || s.includes("수입신고") || s.includes("세관") || s.includes("심사진행")) return 2;
      if (s.includes("cleared") || s.includes("inbound") || s.includes("반입") || s.includes("수리")) return 2;
      if (s.includes("processed") || s.includes("unloaded") || s.includes("입항")) return 2;
      if (s.includes("dispatched") || s.includes("shipped")) return 1;
      if (s.includes("departed") || s.includes("awaiting") || s.includes("출항대기")) return 1;
      if (s.includes("moving to airport")) return 1;
    } else {
      if (s.includes("arrived at icn") || s.includes("인천공항 도착") || s.includes("인천국제공항")) return 2;
      if (s.includes("arrived") && !s.includes("yvr") && !s.includes("밴쿠버")) return 2;
      if (s.includes("customs") || s.includes("import") || s.includes("수입신고") || s.includes("세관") || s.includes("심사진행")) return 2;
      if (s.includes("cleared") || s.includes("inbound") || s.includes("반입") || s.includes("수리")) return 2;
      if (s.includes("processed") || s.includes("unloaded") || s.includes("입항")) return 2;
      if (s.includes("dispatched") || s.includes("shipped")) return 1;
      if (s.includes("departed") || s.includes("awaiting") || s.includes("출항대기")) return 1;
      if (s.includes("moving to airport")) return 1;
    }
    return 0;
  }

  function getStepIndex(rows, direction) {
    if (!rows || rows.length === 0) return 0;
    let highest = 0;
    rows.forEach(function(row) {
      const idx = statusToStep(row.status || "", direction);
      if (idx > highest) highest = idx;
    });
    return highest;
  }

  function getBadge(stepIndex, direction) {
    if (stepIndex === 4) return { cls: "badge-delivered", label: "Delivered" };
    if (stepIndex === 3) return { cls: "badge-transit",   label: "In Transit" };
    if (stepIndex === 2) return { cls: "badge-arrived",   label: direction === "KR_TO_CA" ? "Arrived at YVR" : "Arrived at ICN" };
    if (stepIndex === 1) return { cls: "badge-departed",  label: direction === "KR_TO_CA" ? "Departed ICN"   : "Departed YVR" };
    return { cls: "badge-received", label: "Order Received" };
  }

  function checkSVG() {
    return `<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 9l4.5 4.5L15 5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }
  function planeSVG(c) {
    return `<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M16 9L2 2.5l3.5 6.5L2 15.5 16 9z" fill="${c}"/></svg>`;
  }
  function anchorSVG(c) {
    return `<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="5" r="2.5" stroke="${c}" stroke-width="1.8"/><path d="M9 7.5v8M4.5 12c0 2.5 9 2.5 9 0" stroke="${c}" stroke-width="1.8" stroke-linecap="round"/></svg>`;
  }
  function truckSVG(c) {
    return `<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="1" y="6" width="10" height="8" rx="1" stroke="${c}" stroke-width="1.8"/><path d="M11 8.5h4l2 3.5v2h-6V8.5z" stroke="${c}" stroke-width="1.8" stroke-linejoin="round"/><circle cx="4.5" cy="15" r="1.5" fill="${c}"/><circle cx="13.5" cy="15" r="1.5" fill="${c}"/></svg>`;
  }
  function boxSVG(c) {
    return `<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="6" width="14" height="10" rx="1" stroke="${c}" stroke-width="1.8"/><path d="M2 10h14M7 6V4h4v2" stroke="${c}" stroke-width="1.8" stroke-linecap="round"/></svg>`;
  }

  function getIcon(index, state) {
    if (state === "done") return checkSVG();
    const c = state === "active" ? "white" : "#ccc";
    if (index === 1) return planeSVG(c);
    if (index === 2) return anchorSVG(c);
    if (index === 3) return truckSVG(c);
    if (index === 4) return boxSVG(c);
    return checkSVG();
  }

  function esc(s) {
    return String(s || "")
      .replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function showLoading() {
    document.getElementById("root").innerHTML =
      `<div class="state-box"><div class="spinner"></div>Loading tracking info...</div>`;
    sendHeight();
  }

  function showError(msg) {
    document.getElementById("root").innerHTML =
      `<div class="state-box error">${esc(msg)}</div>`;
    sendHeight();
  }

  function render(data) {
    const rows      = data.rows || [];
    const direction = detectDirection(rows);
    const steps     = direction === "KR_TO_CA" ? STEPS_KR_TO_CA : STEPS_CA_TO_KR;
    const stepIdx   = getStepIndex(rows, direction);
    const badge     = getBadge(stepIdx, direction);
    const latest    = rows.length ? rows[rows.length - 1] : null;
    const history   = rows.slice().reverse();

    // Progress bar
    const fillPct = stepIdx === 0 ? 0 : (stepIdx / (steps.length - 1)) * 80;
    let circlesHtml = '';
    steps.forEach(function(step, i) {
      const state      = i < stepIdx ? "done" : i === stepIdx ? "active" : "pending";
      const labelClass = "step-label" + (i === stepIdx ? " active" : "");
      circlesHtml += `
        <div class="step-item">
          <div class="step-circle step-${state}">${getIcon(i, state)}</div>
          <div class="${labelClass}">${step.label.replace("\n","<br>")}</div>
        </div>`;
    });

    const progressHtml = `
      <div class="progress-wrap">
        <div class="progress-grid">
          <div class="progress-fill" style="width:${fillPct}%"></div>
          ${circlesHtml}
        </div>
      </div>`;

    // Latest event — status on its own line, location in blue below
    let latestHtml = "";
    if (latest) {
      const hasLoc = latest.location && latest.location !== "-";
      const memo   = latest.memo && latest.memo !== "-" ? esc(latest.memo) : "";
      latestHtml = `
        <div class="latest-wrap">
          <div class="latest-box">
            <div class="latest-title">
              <div class="red-dot"></div>
              <div class="latest-title-text">${esc(latest.status)}</div>
            </div>
            ${hasLoc ? `<div class="latest-loc">${esc(latest.location)}</div>` : ""}
            <div class="latest-meta">${esc(latest.date)}${memo ? " · " + memo : ""}</div>
          </div>
        </div>`;
    }

    // History — newest first
    let historyItems = "";
    history.forEach(function(row) {
      const loc = row.location && row.location !== "-" ? row.location : "";
      historyItems += `
        <div class="history-item">
          <div class="h-date">${esc(row.date)}</div>
          <div class="h-right">
            <div class="h-status">${esc(row.status)}</div>
            ${loc ? `<div class="h-loc">${esc(loc)}</div>` : ""}
          </div>
        </div>`;
    });

    document.getElementById("root").innerHTML = `
      <div class="card">
        <div class="card-top">
          <div>
            <div class="lbl">Tracking number</div>
            <div class="hawb">${esc(data.trackingNumber)}</div>
          </div>
          <div class="card-top-right">
            <div><span class="badge ${badge.cls}">${badge.label}</span></div>
            ${latest && latest.date ? `<div class="last-update">Last update: ${esc(latest.date)}</div>` : ""}
          </div>
        </div>
        ${progressHtml}
        ${latestHtml}
        <div class="history-wrap">
          <div class="history-lbl">Shipment history</div>
          <div class="history-scroll">
            ${historyItems || '<p style="color:#999;font-size:15px;padding:14px 0;">No history available.</p>'}
          </div>
        </div>
      </div>`;

    setTimeout(sendHeight, 50);
  }

  window.addEventListener("message", function(event) {
    const d = event.data;
    if (!d) return;
    if (d.action === "loading") { showLoading(); return; }
    if (d.action === "error")   { showError(d.message); return; }
    if (d.action === "result" || d.rows) { render(d); return; }
  });
</script>
</body>
</html>
