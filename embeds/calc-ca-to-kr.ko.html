<meta charset="UTF-8">

<style>

  .main-tabs { display: flex; border-bottom: 2px solid #eee; background: #fff; }
  .main-tab { flex: 1; padding: 18px 0; text-align: center; font-size: 20px; font-weight: 700; color: #666; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.15s; }
  .main-tab.active { color: #c8102e; border-bottom: 3px solid #c8102e; }
  .main-tab:hover:not(.active) { color: #555; }
  .calc-body { display: flex; flex: 1; overflow: hidden; }
  .calc-left { flex: 0 0 460px; padding: 24px; border-right: 1px solid #eee; overflow-y: auto; }
  .calc-right { flex: 1; padding: 24px; background: #fdfdfd; overflow-y: auto; display: flex; flex-direction: column; }
  .field { margin-bottom: 16px; }
  .field-label { font-size: 20px; font-weight: 700; color: #555; letter-spacing: 0.4px; margin-bottom: 8px; }
  select, input[type=number] { width: 100%; padding: 14px 16px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 22px; color: #222; background: #fafafa; appearance: none; -webkit-appearance: none; outline: none; transition: border-color 0.15s; }
  select:focus, input[type=number]:focus { border-color: #c8102e; background: #fff; }
  .select-wrap { position: relative; }
  .select-wrap::after { content: '▾'; position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: #555; pointer-events: none; font-size: 20px; }
  .inputs-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 4px; }
  .field-hint { font-size: 17px; color: #777; margin-top: 4px; line-height: 1.4; }
  .type-toggle { display: flex; margin-bottom: 16px; border: 1.5px solid #ddd; border-radius: 8px; overflow: hidden; }
  .type-btn { flex: 1; padding: 12px; text-align: center; font-size: 20px; font-weight: 700; cursor: pointer; background: #fafafa; color: #666; border: none; transition: all 0.15s; }
  .type-btn.active { background: #c8102e; color: #fff; }
  .type-btn:not(.active):hover { background: #f0f0f0; }
  .quote-btn { width: 100%; padding: 18px; background: #c8102e; color: #fff; border: none; border-radius: 8px; font-size: 24px; font-weight: 700; cursor: pointer; margin-top: 10px; transition: background 0.15s; }
  .quote-btn:hover { background: #a50d26; }
  .quote-btn:active { transform: scale(0.99); }
  .extra-fees-box { background: #fff; border: 1.5px solid #eee; border-radius: 8px; margin-top: 20px; overflow: hidden; }
  .extra-fees-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; cursor: pointer; background: #f9f9f9; }
  .extra-fees-title { font-size: 19px; font-weight: 700; color: #444; }
  .extra-fees-arrow { font-size: 22px; color: #444; transition: transform 0.2s; }
  .extra-fees-arrow.open { transform: rotate(180deg); }
  .extra-fees-list { list-style: none; padding: 12px 16px; margin: 0; display: flex; flex-direction: column; gap: 8px; }
  .extra-fees-list li { display: flex; justify-content: space-between; font-size: 18px; color: #555; border-bottom: 1px dashed #eee; padding-bottom: 6px; }
  .extra-fees-list li:last-child { border-bottom: none; padding-bottom: 0; }
  .extra-fees-list li span { font-weight: 700; color: #c8102e; }
  .result-box { display: none; animation: fadeIn 0.3s ease-out; }
  .result-box.visible { display: block; }

  .res-banner-label { font-size: 18px; font-weight: 600; color: rgba(255,255,255,0.9); margin-bottom: 6px; }
  .res-banner-price { font-size: 46px; font-weight: 900; color: #fff; line-height: 1; }
  .res-banner-price sub { font-size: 24px; font-weight: 600; vertical-align: super; }

  .res-tag { background: rgba(255,255,255,0.2); color: #fff; font-size: 18px; font-weight: 600; padding: 6px 12px; border-radius: 20px; }
  .res-banner-sub { font-size: 18px; color: rgba(255,255,255,0.92); margin-top: 14px; line-height: 1.4; }

  .res-breakdown-title { font-size: 20px; font-weight: 700; color: #333; margin-bottom: 14px; }

  .res-row:last-child { border-bottom: none; }
  .res-row-val { font-weight: 600; }

  .res-row-val.total { color: #c8102e; font-size: 22px; font-weight: 800; }
  .res-row.total-row { border-top: 1.5px solid #eee; margin-top: 6px; padding-top: 14px; }
  .warn-box { background: #fff8e1; border: 1px solid #ffe082; border-radius: 8px; padding: 14px 18px; margin-bottom: 20px; font-size: 19px; color: #7a5c00; display: none; line-height: 1.4; }

  .ocean-card { background: #fff; border: 1.5px solid #dde2f5; border-radius: 10px; padding: 20px; margin-bottom: 12px; }
  .ocean-card-title { font-size: 22px; font-weight: 700; color: #2a3a8a; }

  .ocean-card-min { font-size: 17px; color: #888; margin-bottom: 8px; font-style: italic; }
  .ocean-card-rows { margin-top: 12px; border-top: 1px solid #dde2f5; padding-top: 12px; }
  .ocean-card-row { display: flex; flex-direction: column; font-size: 19px; color: #444; padding: 4px 0; }

  .ocean-note { font-size: 18px; color: #4a508a; padding: 14px 18px; background: #eef0fb; border-radius: 8px; line-height: 1.5; margin-bottom: 20px; }
  .placeholder { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; text-align: center; padding: 20px; color: #999; }

  @media (max-width: 768px) {
    .calc-wrap { height: auto; min-height: 900px; }

    .calc-left { flex: none; width: 100%; border-right: none; border-bottom: 1px solid #eee; overflow-y: visible; }
    .calc-right { overflow-y: visible; }
  }

    {name:'메이플 백 30', sub:'최대 30kg (이민가방: 27kg)', price:'$235', limit:'세 변의 합 170cm 미만', storage:'1개월 무료 → 이후 $10/박스/주'}
  ]},
  qcnb_ocean:   { delivery:'약 7–8주 소요', isWest:false, note:'20kg 이상 화물 진행 시 UPS 픽업 무료, 그 외 $10 픽업비 발생.', options:[
    {name:'메이플 백 30', sub:'최대 30kg (이민가방: 27kg)', price:'$245', limit:'세 변의 합 170cm 미만', storage:'1개월 무료 → 이후 $10/박스/주'}
  ]},
  mb_ns_nl_pe_ocean: { delivery:'약 7–8주 소요', isWest:false, note:'코쉽 박스 보증금 $50. 이민가방 이용 시 UPS 핸들링 $20 발생.', options:[
    {name:'메이플 백 30', sub:'최대 30kg (이민가방: 27kg)', price:'$255', limit:'세 변의 합 170cm 미만', storage:'1개월 무료 → 이후 $10/박스/주'}
  ]}
};

const REGION_MAP = {
  vancouver:{air:'van_air', ocean:'van_ocean'}, bc:{air:'bc_air', ocean:'bc_ocean'},
  ab:{air:'ab_air', ocean:'ab_ocean'}, sk:{air:'sk_air', ocean:'sk_ocean'},
  victoria:{air:'victoria_air', ocean:'victoria_ocean'}, gta:{air:'gta_air', ocean:'gta_ocean'},
  ontario:{air:'on_air', ocean:'on_ocean'}, qcnb:{air:'qcnb_air', ocean:'qcnb_ocean'},
  mb_ns_nl_pe:{air:'mb_air', ocean:'mb_ns_nl_pe_ocean'}
};

let currentTab='air', currentType='general';

function renderFees(list) {
  document.getElementById('fees-list').innerHTML = list.map(f=>`<li>${f.label}<span>${f.val}</span></li>`).join('');
}
function updateFees() {
  const region=document.getElementById('shared-region').value;
  const isWest=WEST_REGIONS.includes(region);
  renderFees(currentTab==='air' ? FEES_AIR : (isWest ? FEES_OCEAN_WEST : FEES_OCEAN_EAST));
  document.getElementById('fees-body').style.display='none';
  document.getElementById('fees-arrow').classList.remove('open');
}
function switchTab(tab) {
  currentTab=tab;
  document.getElementById('tab-air').classList.toggle('active',tab==='air');
  document.getElementById('tab-ocean').classList.toggle('active',tab==='ocean');
  document.getElementById('air-fields').style.display=tab==='air'?'block':'none';
  document.getElementById('ocean-fields').style.display=tab==='ocean'?'block':'none';
  updateFees(); resetResults();
}
function switchType(type) {
  currentType=type;
  document.getElementById('type-general').classList.toggle('active',type==='general');
  document.getElementById('type-docs').classList.toggle('active',type==='docs');
  document.getElementById('general-inputs').style.display=type==='general'?'block':'none';
  resetResults();
}
function resetResults() {
  document.getElementById('result-air').classList.remove('visible');
  document.getElementById('ocean-result').classList.remove('visible');
  document.getElementById('warn-air').classList.remove('visible');
  document.getElementById('result-placeholder').style.display='flex';
  document.getElementById('right-column').scrollTo({top:0,behavior:'smooth'});
}
function onRegionChange() { updateFees(); resetResults(); }
function showError(msg) {
  document.getElementById('result-placeholder').style.display='none';
  document.getElementById('result-air').classList.remove('visible');
  document.getElementById('ocean-result').classList.remove('visible');
  const w=document.getElementById('warn-air');
  w.innerHTML=`<strong>안내:</strong> ${msg}`; w.classList.add('visible');
}
function fuelBracket(kg) {
  if(kg<=5) return 3; if(kg<=10) return 6; if(kg<=15) return 9; if(kg<=20) return 12; return 15;
}
function fuelBlock(base, fuel) {
  return `<div style="margin-top:16px;border:1.5px solid #f5c0c0;border-radius:10px;overflow:hidden;">
    <div style="background:#fff5f5;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none';this.querySelector('.fuel-arrow').style.transform=this.nextElementSibling.style.display==='none'?'':'rotate(180deg)';">
      <span style="font-size:20px;font-weight:700;color:#c8102e;">긴급 유류 할증료 포함 견적 확인</span>
      <span class="fuel-arrow" style="font-size:24px;color:#c8102e;transition:transform 0.2s;">▾</span>
    </div>
    <div style="display:none;padding:16px 20px;background:#fff;">
      <div style="background:#fff5f5;border-radius:8px;padding:16px;">
        <div style="display:flex;justify-content:space-between;font-size:20px;color:#555;padding:5px 0;"><span>기본 운송료 합계</span><span style="font-weight:600;color:#333;">$${base}</span></div>
        <div style="display:flex;justify-content:space-between;font-size:20px;color:#555;padding:5px 0;border-bottom:1px solid #f0c0c0;"><span>긴급 유류 할증료</span><span style="font-weight:700;color:#c8102e;">+$${fuel}.00</span></div>
        <div style="display:flex;justify-content:space-between;font-size:24px;font-weight:800;color:#c8102e;padding:12px 0 0;"><span>최종 예상 금액</span><span>$${(parseFloat(base)+fuel).toFixed(2)}</span></div>
      </div>
    </div>
  </div>`;
}

function calculateAir() {
  const region=document.getElementById('shared-region').value;
  if(!region){showError('출발 지역을 먼저 선택해 주세요.');return;}
  document.getElementById('warn-air').classList.remove('visible');
  document.getElementById('result-placeholder').style.display='none';
  document.getElementById('ocean-result').classList.remove('visible');
  const resultEl=document.getElementById('result-air');
  const isWest=WEST_REGIONS.includes(region);

  if(currentType==='docs') {
    const docRate=DOC_RATES[region];
    if(!docRate){showError('해당 지역의 서류 요금을 찾을 수 없습니다.');return;}
    const fuel=isWest?3:0;
    resultEl.innerHTML=`
      <div class="res-banner">
        <div class="res-banner-label">코쉽 예상 항공 특송비 (CAD)</div>
        <div class="res-banner-price"><sub>$</sub>${docRate}<span style="font-size:28px;">.00</span></div>
        <div class="res-banner-tags"><span class="res-tag">서류</span></div>
        <div class="res-banner-sub">※ 숨은 비용 없음 · 통관비 포함</div>
      </div>
      <div class="res-breakdown">
        <div class="res-breakdown-title">요금 상세 내역</div>
        <div class="res-row"><span class="res-row-label">서류 요금</span><span class="res-row-val">$${docRate}.00</span></div>
        <div class="res-row"><span class="res-row-label">통관 수수료</span><span class="res-row-val incl">포함 ✓</span></div>
        <div class="res-row total-row"><span class="res-row-label" style="font-weight:700;color:#222;">총 합계</span><span class="res-row-val total">$${docRate}.00</span></div>
      </div>
      ${isWest?fuelBlock(docRate+'.00', fuel):''}`;
    resultEl.classList.add('visible');
    return;
  }

  const actualW=parseFloat(document.getElementById('weight').value)||0;
  if(actualW===0){showError('화물의 무게를 입력해 주세요.');return;}
  const r=REGION_MAP[region]?.air;
  const L=parseFloat(document.getElementById('length').value)||0;
  const W=parseFloat(document.getElementById('width').value)||0;
  const H=parseFloat(document.getElementById('height').value)||0;
  const volW=(L>0&&W>0&&H>0)?(L*W*H)/5000:0;
  const chargeableKg=Math.max(actualW,volW);
  const isVolumetric=volW>actualW;

  if(region==='vancouver'&&chargeableKg>30){
    resultEl.innerHTML=`<div class="res-banner" style="border-radius:12px;"><div class="res-banner-label">별도 문의 안내</div><div style="font-size:22px;font-weight:700;color:#fff;margin:6px 0;">밴쿠버 출발 30kg 초과 화물은 고객센터로 별도 문의해 주세요.</div><div class="res-banner-sub">604-455-1000</div></div>`;
    resultEl.classList.add('visible'); return;
  }

  let basePrice=null;
  if(r==='van_air') basePrice=lookupVan(chargeableKg);
  else if(r==='bc_air')  basePrice=lookup(BC_AIR,chargeableKg);
  else if(r==='ab_air')  basePrice=lookup(AB_AIR,chargeableKg);
  else if(r==='sk_air')  basePrice=lookup(SK_AIR,chargeableKg);
  else if(r==='victoria_air') basePrice=lookup(VICTORIA_AIR,chargeableKg);
  else if(r==='gta_air') basePrice=lookup(GTA_AIR,chargeableKg);
  else if(r==='on_air')  basePrice=lookup(ON_AIR,chargeableKg);
  else if(r==='qcnb_air')basePrice=lookup(QCNB_AIR,chargeableKg);
  else if(r==='mb_air')  basePrice=lookup(MB_AIR,chargeableKg);

  if(chargeableKg>40||basePrice===null){
    resultEl.innerHTML=`<div class="res-banner" style="border-radius:12px;"><div class="res-banner-label">별도 문의 안내</div><div style="font-size:22px;font-weight:700;color:#fff;margin:6px 0;">40kg 초과 화물은 고객센터로 별도 문의해 주세요.</div></div>`;
    resultEl.classList.add('visible'); return;
  }

  const isEast=['gta_air','on_air','qcnb_air','mb_air'].includes(r);
  const customsFee=isEast&&chargeableKg>20?10:0;
  const boxIncluded=chargeableKg<10||r==='gta_air';
  const freePickup=region==='vancouver'&&chargeableKg>=10;
  const displayPrice=basePrice.toFixed(2);
  const [dollars,cents]=displayPrice.split('.');
  const chargeLabel=isVolumetric?`부피 무게: ${volW.toFixed(2)} kg`:`실제 무게: ${actualW.toFixed(1)} kg`;
  const fuel=isWest?fuelBracket(chargeableKg):0;
  const totalBase=(parseFloat(displayPrice)+customsFee).toFixed(2);

  resultEl.innerHTML=`
    <div class="res-banner">
      <div class="res-banner-label">코쉽 예상 항공 특송비 (CAD)</div>
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
        <div class="res-banner-price"><sub>$</sub>${dollars}<span style="font-size:28px;">.${cents}</span></div>
        ${isWest?`<div style="background:rgba(255,255,255,0.25);border-radius:20px;padding:6px 14px;font-size:18px;font-weight:700;color:#fff;">+ 유류 할증료 <span style="font-size:16px;font-weight:400;">미포함</span></div>`:''}
      </div>
      <div class="res-banner-tags">
        <span class="res-tag">적용 무게: ${chargeableKg.toFixed(2)} kg</span>
        <span class="res-tag">${chargeLabel}</span>
      </div>
      <div class="res-banner-sub">※ 숨은 비용 없음 · 통관비 포함${freePickup ? ' · 픽업 포함' : ''}</div>
    </div>
    <div class="res-breakdown">
      <div class="res-breakdown-title">요금 상세 내역</div>
      <div class="res-row"><span class="res-row-label">기본 운송료</span><span class="res-row-val">$${displayPrice}</span></div>
      <div class="res-row"><span class="res-row-label">통관 수수료</span><span class="res-row-val incl">포함 ✓</span></div>
      ${boxIncluded?`<div class="res-row"><span class="res-row-label">박스/포장비</span><span class="res-row-val incl">포함 ✓</span></div>`:''}
      ${freePickup?`<div class="res-row"><span class="res-row-label">무료 픽업 (메트로 밴쿠버, 10kg 이상)</span><span class="res-row-val incl">포함 ✓</span></div>`:''}
      ${customsFee?`<div class="res-row"><span class="res-row-label">동부 통관 수수료 (20kg 초과)</span><span class="res-row-val" style="color:#c8102e;">+$${customsFee}.00</span></div>`:''}
      <div class="res-row total-row"><span class="res-row-label" style="font-weight:700;color:#222;">총 합계</span><span class="res-row-val total">$${totalBase}</span></div>
    </div>
    ${isWest?fuelBlock(totalBase,fuel):''}`;
  resultEl.classList.add('visible');
  const warnEl=document.getElementById('warn-air');
  if(L>100||W>100||H>100){warnEl.innerHTML='한 변이 1m를 초과합니다 — 대형 수화물 요금이 추가로 발생할 수 있습니다.';warnEl.classList.add('visible');}
}

function showOceanQuote() {
  const region=document.getElementById('shared-region').value;
  if(!region){showError('출발 지역을 먼저 선택해 주세요.');return;}
  document.getElementById('warn-air').classList.remove('visible');
  document.getElementById('result-placeholder').style.display='none';
  document.getElementById('result-air').classList.remove('visible');
  const el=document.getElementById('ocean-result');
  const r=REGION_MAP[region]?.ocean;
  const data=OCEAN_DATA[r];
  if(!data) return;

  let html=`<div style="font-size:18px;color:#8a90b0;margin:0 0 10px;">${data.delivery} · 모든 금액은 CAD 기준입니다</div>`;
  data.options.forEach(opt=>{
    html+=`<div class="ocean-card">
      <div class="ocean-card-title">${opt.name}</div>
      <div class="ocean-card-sub">${opt.sub}</div>
      <div class="ocean-card-price">${opt.price} / 박스</div>
      <div class="ocean-card-min">※ 기본 최소 2박스 이상 진행</div>
      <div class="ocean-card-rows">
        <div class="ocean-card-row"><span>제한 사이즈</span><span>${opt.limit}</span></div>
        <div class="ocean-card-row"><span>보관료</span><span>${opt.storage}</span></div>
      </div>
    </div>`;
  });
  html+=`<div class="ocean-note">${data.note}</div>`;
  if(data.isWest){
    html+=`<div style="margin-top:16px;border:1.5px solid #f5c0c0;border-radius:10px;overflow:hidden;">
      <div style="background:#fff5f5;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none';this.querySelector('.fuel-arrow').style.transform=this.nextElementSibling.style.display==='none'?'':'rotate(180deg)';">
        <span style="font-size:20px;font-weight:700;color:#c8102e;">긴급 유류 할증료 안내 보기</span>
        <span class="fuel-arrow" style="font-size:24px;color:#c8102e;transition:transform 0.2s;">▾</span>
      </div>
      <div style="display:none;padding:16px 20px;background:#fff;">
        <p style="font-size:19px;color:#555;line-height:1.6;margin-bottom:12px;">국제 유가 변동으로 선박 택배에 유류 할증료가 한시적으로 적용 중입니다.</p>
        <div style="background:#fff5f5;border-radius:8px;padding:16px;">
          <div style="display:flex;justify-content:space-between;font-size:20px;color:#555;padding:5px 0;"><span>메이플 박스 (20KG &amp; 30KG)</span><span style="font-weight:700;color:#c8102e;">+$9 / 박스당</span></div>
          <div style="display:flex;justify-content:space-between;font-size:20px;color:#555;padding:5px 0;"><span>메이플 번들 10 / 20</span><span style="font-weight:700;color:#c8102e;">고객센터 문의</span></div>
        </div>
      </div>
    </div>`;
  }
  el.innerHTML=html; el.classList.add('visible');
}

function lookupVan(kg){for(let i=0;i<VAN_AIR.length;i++)if(kg<=VAN_AIR[i][0])return VAN_AIR[i][1];return null;}
function lookup(t,kg){for(let i=0;i<t.length;i++)if(kg<=t[i][0])return t[i][1];return t[t.length-1][1];}
function toggleFees(){
  const b=document.getElementById('fees-body'),a=document.getElementById('fees-arrow');
  const open=b.style.display!=='none'; b.style.display=open?'none':'block'; a.classList.toggle('open',!open);
}
renderFees(FEES_AIR);
</script>
</body>
</html>
